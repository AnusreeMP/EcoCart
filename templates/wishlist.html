{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>My Wishlist</title>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f1f3f6;
      margin: 0;
    }

    /* NAVBAR */
    .ec-navbar {
      background: #2e7d32;
      color: #fff;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ec-logo {
      font-weight: 700;
      font-size: 20px;
      text-decoration: none;
      color: white;
    }

    .ec-search {
      flex: 1;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ec-search input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 24px;
      border: none;
      outline: none;
    }

    .ec-search button {
      background: #4caf50;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .icon-btn {
      color: white;
      text-decoration: none;
      padding: 6px 10px;
      font-size: 15px;
    }

    .icon-badge {
      background: #ff6f00;
      border-radius: 50%;
      padding: 2px 6px;
    }

    .container {
      max-width: 1050px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }

    h1 {
      margin-bottom: 20px;
      color: #1b5e20;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    /* CARD */
    .w-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      transition: 0.2s;
      display: flex;
      flex-direction: column;
    }

    .w-card:hover {
      transform: translateY(-3px);
    }

    /* IMAGE */
    .w-img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* NAME */
    .w-name {
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
      color: #222;
    }

    /* DESCRIPTION */
    .w-desc {
      margin-top: 6px;
      font-size: 13px;
      color: #555;
      line-height: 1.4;
      min-height: 60px;
    }

    /* PRICE */
    .w-price {
      font-size: 18px;
      font-weight: bold;
      color: #2e7d32;
      margin-top: 10px;
    }

    /* ACTION BUTTONS */
    .actions {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-move {
      background: #ff9f00;
      padding: 8px;
      border-radius: 6px;
      border: none;
      color: white;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
    }

    .btn-remove {
      background: #d32f2f;
      padding: 8px;
      color: white;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
    }

    .remove-form {
      width: 100%;
    }
  </style>
</head>

<body>

  <!-- ✅ NAVBAR ADDED HERE -->
  <header class="ec-navbar">
    <a href="{% url 'userhome' %}" class="ec-logo">🌿 EcoCart</a>

    <form action="{% url 'search' %}" method="get" class="ec-search">
      <input type="text" name="query" placeholder="Search eco-friendly products...">
      <button type="submit">Search</button>
    </form>

    <a href="{% url 'wishlist' %}" class="icon-btn">
      ❤️ Wishlist <span class="icon-badge">{{ items.count }}</span>
    </a>

    <a href="{% url 'cart' %}" class="icon-btn">🛒 Cart</a>
  </header>


  <!-- PAGE CONTENT -->
  <div class="container">
    <h1>My Wishlist</h1>

    <div class="grid">

      {% for item in items %}
      <div class="w-card">

        <img src="{{ item.product.image.url }}" class="w-img">

        <p class="w-name">{{ item.product.name }}</p>

        <p class="w-desc">{{ item.product.description }}</p>

        <p class="w-price">₹{{ item.product.price }}</p>

        <div class="actions">

          <form method="POST" action="{% url 'add_to_cart_from_wishlist' item.id %}" style="width:100%;">
            {% csrf_token %}
            <button class="btn-move">MOVE TO CART</button>
          </form>

          <form method="POST" action="{% url 'remove_item' item.id %}" class="remove-form">
            {% csrf_token %}
            <button class="btn-remove">✕</button>
          </form>

        </div>

      </div>
      {% endfor %}

    </div>

  </div>

</body>

</html>
